name: Instagram

# Una volta al giorno legge il profilo @oakvx con agent-reach (solo lettura) e aggiorna
# assets/social/manuale.json. Se Instagram chiede il login, blocca o limita le richieste,
# il passo termina senza modificare nulla e il workflow resta verde.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/aggiorna_instagram.py
      - .github/workflows/instagram.yml

permissions:
  contents: write

concurrency:
  group: instagram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installa agent-reach
        run: pip install "git+https://github.com/Panniantong/Agent-Reach"
      - name: Stato di agent-reach
        continue-on-error: true
        run: agent-reach doctor --text
      - name: Leggi il profilo
        run: python3 scripts/aggiorna_instagram.py --stampa-risposta
      - name: Salva se qualcosa è cambiato
        run: |
          if [ -n "$(git status --porcelain -- assets/social/manuale.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/social/manuale.json
            git commit -m "Update Instagram counts"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
