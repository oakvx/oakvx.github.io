name: Instagram

# Una volta al giorno apre il profilo pubblico @oakvx con un browser (Playwright), legge follower,
# seguiti e post dalla descrizione della pagina e aggiorna assets/social/manuale.json.
# Se Instagram mostra il login o i numeri non si leggono, non cambia niente e il workflow resta verde.
# Lo screenshot della pagina resta scaricabile da "Artifacts" nel riepilogo del run.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/instagram_pagina.mjs
      - .github/workflows/instagram.yml

permissions:
  contents: write

concurrency:
  group: instagram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa Playwright
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Leggi il profilo
        env:
          PLAYWRIGHT_PATH: ${{ runner.temp }}/pw/node_modules/playwright
        run: node scripts/instagram_pagina.mjs "$RUNNER_TEMP/instagram.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-screenshot
          path: ${{ runner.temp }}/instagram.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Salva se qualcosa è cambiato
        run: |
          if [ -n "$(git status --porcelain -- assets/social/manuale.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/social/manuale.json
            git commit -m "Update Instagram counts"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
