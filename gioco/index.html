<!DOCTYPE html>
<html lang="it">
<head>

<meta name="robots" content="noindex">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="gioco.css">
</head>
<body class="in-menu">
<canvas id="scena" aria-hidden="true"></canvas>

<header class="hud-top">
  <p class="firma"><strong data-t="nome">Gabriele Lucia</strong> <span data-t="ruolo">junior web developer · Sassuolo</span> <span class="beta" data-t="beta">beta</span></p>
  <nav class="hud-azioni" aria-label="Comandi">
    <button type="button" id="lingua" class="tasto" aria-label="Switch to English">EN</button>
    <button type="button" id="audio" class="tasto" aria-pressed="true" data-t="audioOn">Audio: sì</button>
    <a id="classica" class="tasto tasto-forte" href="../" data-t="classica">Torna al sito</a>
  </nav>
</header>

<main id="menu" class="menu">
  <h1 data-t="menuTitolo">Ciao, sono oakvx.</h1>
  <p class="menu-intro" data-t="menuIntro"></p>
  <div class="menu-scelte">
    <a class="scelta" id="scelta-sito" href="../" data-classica>
      <span class="scelta-nome" data-t="sceltaSito">Sito</span>
      <span class="scelta-nota" data-t="sceltaSitoNota">progetti, percorso, contatti</span>
    </a>
    <button type="button" class="scelta scelta-gioco" id="scelta-gioco">
      <span class="scelta-nome" data-t="sceltaGioco">Gioco</span>
      <span class="scelta-nota" data-t="sceltaGiocoNota">3D, da computer</span>
    </button>
  </div>
  <p id="avviso" class="avviso" hidden></p>
  <p class="comandi" data-t="comandi"></p>
</main>

<div id="mirino" class="mirino" hidden></div>
<p id="suggerimento" class="suggerimento" hidden></p>
<div id="sottotitoli" class="sottotitoli medi" aria-live="polite" hidden>
  <p><span id="sott-nome" class="sott-nome"></span><span id="sott-pagine" class="pagine" hidden aria-hidden="true"><i></i><i></i><i></i></span></p>
  <p id="sott-testo" class="sott-testo"></p>
</div>
<div id="finestre" class="finestre" hidden aria-hidden="true"><i class="a"></i><i class="b"></i></div>

<section id="avvio" class="pannello" hidden aria-live="polite">
  <div id="caricatore" class="caricatore" aria-hidden="true"><i></i><i></i><i></i></div>
  <p id="avvio-testo" data-t="caricamento">Il curatore sta cercando le chiavi…</p>
  <button type="button" id="avvio-entra" class="tasto tasto-forte" hidden data-t="clicPerIniziare">Clic per entrare</button>
</section>

<section id="pausa" class="pannello" hidden aria-labelledby="pausa-titolo">
  <h2 id="pausa-titolo" data-t="pausa">In pausa</h2>
  <p class="comandi" data-t="comandi"></p>
  <fieldset class="impostazioni">
    <legend data-t="impostazioni">Impostazioni</legend>
    <label><span data-t="fov">Campo visivo</span> <input type="range" id="imp-fov" min="60" max="100" step="1"> <output id="imp-fov-v"></output></label>
    <label><span data-t="sensibilita">Sensibilità</span> <input type="range" id="imp-sens" min="0.4" max="2" step="0.1"> <output id="imp-sens-v"></output></label>
    <label><span data-t="sottotitoli">Sottotitoli</span>
      <select id="imp-sott"><option value="piccoli" data-t="piccoli">Piccoli</option><option value="medi" data-t="medi">Medi</option><option value="grandi" data-t="grandi">Grandi</option></select></label>
    <label><span data-t="qualita">Qualità delle finestre</span>
      <select id="imp-qual"><option value="0.5" data-t="bassa">Bassa</option><option value="1" data-t="alta">Alta</option></select></label>
    <label class="spunta"><input type="checkbox" id="imp-calmo"> <span data-t="calmo">Riduci oscillazioni e distorsioni</span></label>
  </fieldset>
  <div class="scelte">
    <button type="button" id="riprendi" class="tasto tasto-forte" data-t="riprendi">Riprendi</button>
    <button type="button" id="punto-controllo" class="tasto" data-t="puntoControllo">Torna al punto di ripresa</button>
    <button type="button" id="ricomincia-pausa" class="tasto" data-t="ricomincia">Ricomincia</button>
    <a class="tasto" href="../" data-classica data-t="classica">Torna al sito</a>
  </div>
</section>

<aside id="cartiglio" class="cartiglio" hidden aria-live="polite">
  <h2 id="cartiglio-titolo"></h2>
  <p id="cartiglio-testo"></p>
  <p class="cartiglio-chiudi" data-t="chiudiCartiglio">E per chiudere</p>
</aside>

<section id="finale" class="pannello finale" hidden role="dialog" aria-modal="true" aria-labelledby="finale-titolo">
  <h2 id="finale-titolo"></h2>
  <div id="finale-contenuto"></div>
  <div class="scelte">
    <button type="button" id="ricomincia" class="tasto tasto-forte" data-t="ricomincia">Ricomincia</button>
    <a class="tasto" href="../" data-classica data-t="classica">Torna al sito</a>
  </div>
</section>

<p id="data2008" class="data2008" hidden aria-hidden="true"></p>
<div id="velo" class="velo" aria-hidden="true"></div>

</html>
